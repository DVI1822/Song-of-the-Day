<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TopTrack</title>
<style>
  html,body{margin:0;height:100%;background:#FFFDF6;color:#0D2A3F;font:600 17px/1.4 -apple-system,system-ui,sans-serif}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  img{width:132px;height:132px;border-radius:30px}
  h1{margin:6px 0 0;font-size:26px}
  p{margin:0;max-width:280px;font-weight:400}
  button{margin-top:10px;height:48px;padding:0 28px;border:0;border-radius:24px;background:#0D2A3F;color:#fff;font:inherit}
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>No connection</h1>
  <p>TopTrack needs the internet to show today's songs. Try again when you're back online.</p>
  <button onclick="location.href='https://www.mytoptrack.io'">Try again</button>
</main>
<script>try{window.Capacitor.Plugins.SplashScreen.hide()}catch(e){}</script>
</body>
</html>
